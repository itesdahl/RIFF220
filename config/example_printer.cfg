[include mainsail.cfg]


[mcu]
serial: /dev/serial/by-id/
[mcu xy]
serial: /dev/serial/by-id/

[virtual_sdcard]
on_error_gcode: CANCEL_PRINT


# This file contains common pin mappings for SKR V1.4 and SKR Pico
# board. To use this config, the firmware should be compiled for the
# LPC1768 and RP2040.

# For the DIY-printer RIFF220

[exclude_object]
[force_move]
enable_force_move: True

[include homing.cfg]
[include stealthburner_leds.cfg]
#[include clean_nozzle.cfg]


[stepper_x]
step_pin: xy:gpio11
dir_pin: !xy:gpio10
enable_pin: !xy:gpio12
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 220
position_min: 0
position_max: 220
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: xy:gpio9
tx_pin: xy:gpio8
uart_address: 0
run_current: 1.02
diag_pin: ^xy:gpio4
driver_SGTHRS: 65

[stepper_y]
step_pin: xy:gpio6
dir_pin: !xy:gpio5
enable_pin: !xy:gpio7
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 230
position_max: 230
position_min: 0
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: xy:gpio9
tx_pin: xy:gpio8
uart_address: 2
run_current: 1.02
diag_pin: ^xy:gpio3
driver_SGTHRS: 65

[extruder]
step_pin: xy:gpio14
dir_pin: !xy:gpio13
enable_pin: !xy:gpio15
microsteps: 16
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 10
max_temp: 280
max_power: 0.8
min_extrude_temp: 170
heater_pin: xy:gpio23
sensor_type: Generic 3950
sensor_pin: xy:gpio27
control = pid
pid_kp = 36.405
pid_ki = 13.484
pid_kd = 24.573
min_temp: 0
max_temp: 280

[tmc2209 extruder]
uart_pin: xy:gpio9
tx_pin: xy:gpio8
uart_address: 3
run_current: 0.500
stealthchop_threshold: 0

[probe]
pin: xy:gpio22
x_offset: 0
y_offset: 25
z_offset: 2.075
samples: 3
samples_result: median
sample_retract_dist: 3
samples_tolerance: 0.025
samples_tolerance_retries: 3

[stepper_z]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
rotation_distance: 8
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 220
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: P1.10
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
rotation_distance: 8
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: P1.4
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
rotation_distance: 8
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: P1.1
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[fan]
pin: xy:gpio17

[heater_fan heatbreak_cooling_fan]
pin: xy:gpio18

[controller_fan radxa_fan]
pin: P2.4
max_power: 1.0
kick_start_time: 0.5
fan_speed: 1.0 # 1.0 = 100%
idle_timeout: 999999 # Keeps it on for a long time



[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 50, 50
mesh_max: 180, 180
probe_count: 6

[heater_bed]
heater_pin: xy:gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: xy:gpio26
control: pid
pid_kp = 63.296
pid_ki = 1.580
pid_kd = 633.725
min_temp: 0
max_temp: 105

[z_tilt]
##  Use Z_TILT_ADJUST to level the bed
z_positions:
	-45,35
	110,300
	260,35
points:
	30,25
	110,180
	180,25
speed:100
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0750

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 6000 # limits not tested
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0



########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"


[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2


[output_pin beeper]
pin: EXP1_1

[neopixel fysetc_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4


#macros from here

[gcode_macro _HOME_X]
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
gcode:
    # Set current for sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.7 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 Y
    # Move away
    G91
    G1 Y-10 F1200

    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    # Heat bed for probing
    M190 S{BED_TEMP}
    # Use absolute coordinates
    G90
    M104 S180; set extruder temp
    # Home the printer
    G28
    Z_TILT_ADJUST
    # If you are generating a new bed mesh:
    BED_MESH_CALIBRATE ADAPTIVE=1
    # Move the nozzle near the bed
    G1 Z20 F3000
    # Set and wait for nozzle to reach printing temperature
    M109 S{EXTRUDER_TEMP}
    #clean_nozzle
    #absolute coordinates
    G90
    # Move Z axis up 
    G1 Z2.0 F3000 
    # Move to start position 
    G1 X10.1 Y20 Z0.2 F5000.0 
    SET_NOZZLE_LEDS_ON
    # Draw the first line
    G1 X10.1 Y150.0 Z0.2 F1000.0 E12
    # Reset extruder 
    G92 E0


[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Move nozzle away from print while retracting
    G91
    G1 X-2 Y-2 E-3 F300
    # Raise nozzle by 10mm
    G1 Z50 F3000
    G90
    SET_NOZZLE_LEDS_OFF
    # Disable steppers
    M84
[gcode_macro LOAD_FILAMENT]
gcode:
     M109 S230; set extruder temp
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    M300 # beep
    G91
    G92 E0
    G1 E350 F{max_velocity} # fast-load
    G1 E25 F{speed} # purge
    M300
    M300
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    M109 S230; set extruder temp
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    M300 # beep
    G92 E0
    G1 E25 F{speed} # purge
    G1 E-420 F{max_velocity} # fast-unload
    M300
    M300
    RESTORE_GCODE_STATE NAME=unload_state

